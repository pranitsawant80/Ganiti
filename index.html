<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171c1e">
  <title>Ganiti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Master Calculator</p>
        <h1>Ganiti<span>♾️</span></h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" type="button" title="Switch to light theme" aria-label="Switch to light theme">
          <span class="theme-icon" aria-hidden="true">☼</span><span class="theme-label">LIGHT</span>
        </button>
        <div class="status-dot" title="Calculator ready"><span></span> READY</div>
      </div>
    </header>

    <section class="calculator" aria-label="Scientific calculator">
      <div class="display-panel">
        <div class="display-topline">
          <span id="memoryStatus">M 0</span>
          <span id="angleStatus">DEG</span>
        </div>
        <div id="expression" class="expression" aria-label="Expression">0</div>
        <div id="result" class="result" aria-live="polite">0</div>
      </div>

      <div class="utility-row">
        <button class="utility-button" data-action="undo" title="Undo (Ctrl/Cmd + Z)">↶ <span>Undo</span></button>
        <button class="utility-button" data-action="redo" title="Redo (Ctrl/Cmd + Y)">↷ <span>Redo</span></button>
        <button class="utility-button" data-action="copy" title="Copy result">▣ <span>Copy</span></button>
        <button class="angle-toggle" id="angleToggle" title="Toggle degree/radian mode">DEG</button>
      </div>

      <div class="memory-row">
        <button data-action="memory-clear">MC</button>
        <button data-action="memory-recall">MR</button>
        <button data-action="memory-add">M+</button>
        <button data-action="memory-subtract">M−</button>
        <span class="memory-caption">Memory</span>
      </div>

      <div class="variables-row">
        <button data-value="ans">ANS</button>
        <button data-value="x">x</button>
        <button data-value="y">y</button>
        <input id="variableValue" type="number" placeholder="Value">
        <button data-variable="x" title="Store value in x">STO x</button>
        <button data-variable="y" title="Store value in y">STO y</button>
      </div>

      <div class="keypad" id="keypad">
        <button class="key function" data-value="sin(">sin</button>
        <button class="key function" data-value="cos(">cos</button>
        <button class="key function" data-value="tan(">tan</button>
        <button class="key function" data-value="log(">log</button>
        <button class="key function" data-value="ln(">ln</button>
        <button class="key control" data-action="clear">AC</button>
        <button class="key control" data-action="backspace">⌫</button>
        <button class="key operator" data-value="%">%</button>

        <button class="key function" data-value="asin(">sin⁻¹</button>
        <button class="key function" data-value="acos(">cos⁻¹</button>
        <button class="key function" data-value="atan(">tan⁻¹</button>
        <button class="key function" data-value="sqrt(">√</button>
        <button class="key function" data-value="cbrt(">∛</button>
        <button class="key function" data-value="abs(">abs</button>
        <button class="key function" data-value="1/(" title="Reciprocal (closing bracket added automatically)">1/x</button>
        <button class="key operator" data-value="^">xʸ</button>
        <button class="key operator" data-value="mod">mod</button>

        <button class="key constant" data-value="π">π</button>
        <button class="key constant" data-value="e">e</button>
        <button class="key" data-value="(">(</button>
        <button class="key" data-value=")">)</button>
        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="÷">÷</button>

        <button class="key function" data-value="!">x!</button>
        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="×">×</button>
        <button class="key operator" data-value="−">−</button>
        <button class="key operator" data-value="+">+</button>
        <button class="key equals" data-action="equals">=</button>

        <button class="key fraction" data-value="1/" title="Reciprocal shortcut: inserts 1/">a/b</button>
        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
      </div>
      <p class="keyboard-hint">Keyboard enabled <span>·</span> Enter to calculate</p>
    </section>

    <section class="history-panel" aria-labelledby="historyTitle">
      <div class="history-header">
        <div>
          <p class="eyebrow">Your calculations</p>
          <h2 id="historyTitle">History</h2>
        </div>
        <button class="history-clear" id="clearHistory" type="button">Clear all</button>
      </div>
      <label class="history-search">
        <span class="sr-only">Search calculation history</span>
        <input id="historySearch" type="search" placeholder="Search expressions or results">
      </label>
      <div id="historyList" class="history-list" aria-live="polite"></div>
    </section>

    <section class="toolbox" aria-label="Calculation tools">
      <div class="tool-tabs" role="tablist">
        <button class="tool-tab active" data-tool="explain">Explain</button>
        <button class="tool-tab" data-tool="convert">Convert</button>
        <button class="tool-tab" data-tool="finance">Finance</button>
        <button class="tool-tab" data-tool="equation">Equation</button>
        <button class="tool-tab" data-tool="graph">Graph</button>
        <button class="tool-tab" data-tool="data">Data</button>
        <button class="tool-tab" data-tool="programmer">Programmer</button>
      </div>
      <div class="tool-panel active" data-panel="explain"><p id="steps">Calculate an expression to see the working.</p></div>
      <div class="tool-panel" data-panel="convert">
        <div class="tool-form"><input id="convertValue" type="number" value="1"><select id="convertFrom"><option value="m">Metres</option><option value="km">Kilometres</option><option value="mi">Miles</option><option value="ft">Feet</option><option value="c">Celsius</option><option value="f">Fahrenheit</option></select><span>to</span><select id="convertTo"><option value="ft">Feet</option><option value="m">Metres</option><option value="km">Kilometres</option><option value="mi">Miles</option><option value="c">Celsius</option><option value="f">Fahrenheit</option></select><button id="convertButton">Convert</button></div><output id="convertResult">1</output>
      </div>
      <div class="tool-panel" data-panel="finance"><div class="tool-form"><input id="financePrincipal" type="number" placeholder="Principal"><input id="financeRate" type="number" placeholder="Annual %"><input id="financeYears" type="number" placeholder="Years"><button id="financeButton">Compound</button></div><output id="financeResult">Enter values to calculate growth.</output></div>
      <div class="tool-panel" data-panel="equation"><div class="tool-form"><input id="equationA" type="number" placeholder="a"><span>x +</span><input id="equationB" type="number" placeholder="b"><span>=</span><input id="equationC" type="number" placeholder="c"><button id="equationButton">Solve x</button></div><output id="equationResult"></output></div>
      <div class="tool-panel" data-panel="graph"><div class="tool-form"><input id="graphFunction" value="x^2" placeholder="x^2, sin(x), ..."><button id="graphButton">Plot</button></div><canvas id="graphCanvas" width="720" height="260" aria-label="Function graph"></canvas></div>
      <div class="tool-panel" data-panel="data"><div class="tool-form"><input id="dataValues" placeholder="12, 15, 18, 20"><button id="statsButton">Analyze</button></div><output id="statsResult"></output><div class="tool-form matrix-form"><input id="matrixValues" placeholder="1 2; 3 4"><button id="matrixButton">Matrix determinant</button></div><output id="matrixResult"></output></div>
      <div class="tool-panel" data-panel="programmer"><div class="tool-form"><input id="programmerValue" type="number" placeholder="Decimal value"><button id="programmerButton">Convert bases</button></div><output id="programmerResult"></output></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
